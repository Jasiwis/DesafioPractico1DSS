<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Analizador de números</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100"> 

    <div class="container"> <!-- Contenedor principal de la página -->
        <div class="card border-0 shadow-lg w-50 mx-auto rounded-4 overflow-hidden"> 
            <div class="card-header bg-primary text-white text-center py-3"> 
                <h2 class="fw-bold mb-0">Analizador de Números</h2> 
            </div>
            <div class="card-body p-4"> <!-- Cuerpo de la tarjeta con relleno -->
                <form action="../php/procesar.php" method="POST"> <!-- Formulario que envía los datos al archivo PHP 'procesar.php' -->
                    <div class="mb-3"> <!-- Campo para ingresar los números -->
                        <label for="numeros" class="form-label fw-semibold">Ingrese números separados por comas:</label>
                        <input type="text" id="numeros" name="numeros" class="form-control form-control-lg rounded-3" placeholder="Ej: 1, 8, 0, 9, 4" required> <!-- Campo de texto para que el usuario ingrese los números -->
                    </div>
                    <div class="d-grid"> <!-- Contenedor para el botón -->
                        <button type="submit" class="btn btn-lg btn-primary rounded-3">Procesar</button> <!-- Botón de envío para procesar los números -->
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- Script de Bootstrap para funcionalidades interactivas -->
</body>
</html>
